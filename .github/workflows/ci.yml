---
name: "CI"
"on":
  push:
    branches:
    - "main"
  pull_request:
    branches:
    - "main"
concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
env:
  JAVA_VERSION: "25"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository -Xmx2g"
jobs:
  spotless:
    name: "quality / spotless"
    runs-on: "ubuntu-latest"
    steps:
    - uses: "actions/checkout@v4"
    - uses: "actions/setup-java@v4"
      with:
        distribution: "temurin"
        java-version: "${{ env.JAVA_VERSION }}"
        cache: "maven"
    - run: "./mvnw -B -ntp spotless:check"
  checkstyle:
    name: "quality / checkstyle"
    runs-on: "ubuntu-latest"
    steps:
    - uses: "actions/checkout@v4"
    - uses: "actions/setup-java@v4"
      with:
        distribution: "temurin"
        java-version: "${{ env.JAVA_VERSION }}"
        cache: "maven"
    - run: "./mvnw -B -ntp checkstyle:check"
  pmd:
    name: "quality / pmd"
    runs-on: "ubuntu-latest"
    steps:
    - uses: "actions/checkout@v4"
    - uses: "actions/setup-java@v4"
      with:
        distribution: "temurin"
        java-version: "${{ env.JAVA_VERSION }}"
        cache: "maven"
    - run: "./mvnw -B -ntp compile pmd:check"
  spotbugs:
    name: "quality / spotbugs"
    runs-on: "ubuntu-latest"
    steps:
    - uses: "actions/checkout@v4"
    - uses: "actions/setup-java@v4"
      with:
        distribution: "temurin"
        java-version: "${{ env.JAVA_VERSION }}"
        cache: "maven"
    - run: "./mvnw -B -ntp compile spotbugs:check"
  archunit:
    name: "quality / archunit"
    runs-on: "ubuntu-latest"
    steps:
    - uses: "actions/checkout@v4"
    - uses: "actions/setup-java@v4"
      with:
        distribution: "temurin"
        java-version: "${{ env.JAVA_VERSION }}"
        cache: "maven"
    - run: "./mvnw -B -ntp test -Dtest='*ArchitectureTest'"
  modulith:
    name: "modulith / verify"
    runs-on: "ubuntu-latest"
    steps:
    - uses: "actions/checkout@v4"
    - uses: "actions/setup-java@v4"
      with:
        distribution: "temurin"
        java-version: "${{ env.JAVA_VERSION }}"
        cache: "maven"
    - run: "./mvnw -B -ntp test -Dtest='*ApplicationModulesIntegrationTest'"
  unit-tests:
    name: "tests / unit"
    runs-on: "ubuntu-latest"
    steps:
    - uses: "actions/checkout@v4"
    - uses: "actions/setup-java@v4"
      with:
        distribution: "temurin"
        java-version: "${{ env.JAVA_VERSION }}"
        cache: "maven"
    - run: "./mvnw -B -ntp test -DexcludedGroups=integration"
    - name: "Upload surefire reports on failure"
      if: "failure()"
      uses: "actions/upload-artifact@v4"
      with:
        name: "surefire-reports"
        path: "target/surefire-reports/"
        retention-days: 7
  integration-tests:
    name: "tests / integration"
    runs-on: "ubuntu-latest"
    steps:
    - uses: "actions/checkout@v4"
    - uses: "actions/setup-java@v4"
      with:
        distribution: "temurin"
        java-version: "${{ env.JAVA_VERSION }}"
        cache: "maven"
    - run: "./mvnw -B -ntp verify -DskipUnitTests=true -Dspotless.skip=true -Dcheckstyle.skip=true\
        \ -Dpmd.skip=true -Dspotbugs.skip=true -Djacoco.skip=true"
    - name: "Upload failsafe reports on failure"
      if: "failure()"
      uses: "actions/upload-artifact@v4"
      with:
        name: "failsafe-reports"
        path: "target/failsafe-reports/"
        retention-days: 7
  coverage:
    name: "quality / coverage"
    runs-on: "ubuntu-latest"
    needs:
    - "unit-tests"
    - "integration-tests"
    steps:
    - uses: "actions/checkout@v4"
    - uses: "actions/setup-java@v4"
      with:
        distribution: "temurin"
        java-version: "${{ env.JAVA_VERSION }}"
        cache: "maven"
    - run: "./mvnw -B -ntp verify -Dspotless.skip=true -Dcheckstyle.skip=true -Dpmd.skip=true\
        \ -Dspotbugs.skip=true"
    - name: "Upload coverage report"
      if: "always()"
      uses: "actions/upload-artifact@v4"
      with:
        name: "jacoco-report"
        path: "target/site/jacoco/"
        retention-days: 14
