spring:
  application:
    name: retirement-planner
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: 8181

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Application-specific configuration. See ADR-001 (auth modes),
# ADR-006 (BlobStore), ADR-008 (Modulith).
app:
  auth:
    # Mode: stub | passkey. Stub installs a fixed solo principal for
    # local development and integration tests; passkey is a placeholder
    # until EPIC-8 wires WebAuthn. Profiles override as needed.
    mode: stub
    solo-principal: owner
  cors:
    # Strict allowlist is the defense-in-depth layer for browser-
    # mediated token replay. Empty in defaults; profiles populate
    # actual origins. Container deploys can override via
    # APP_CORS_ALLOWED_ORIGINS (comma-separated).
    allowed-origins: []
    allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowed-headers: ["*"]
    allow-credentials: false
    max-age: 1h
  blobstore:
    # Local filesystem implementation per ADR-006. SaaS phase swaps
    # to S3/GCS/Azure-Blob; the interface stays the same.
    type: filesystem
    root: ${RETIREMENT_DATA_DIR:./data/blobs}
  disclaimer: >-
    Output is illustrative and not financial advice.
    The model captures the most material provisions of US federal and
    state tax law for retirement planning, but is not a substitute for
    a licensed financial advisor or tax professional.
