# Production profile. Connection details, secrets, and BlobStore
# location supplied via environment variables — no secrets in source.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

server:
  forward-headers-strategy: framework

logging:
  level:
    root: WARN
    io.github.xmljim.retirement: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

app:
  auth:
    mode: passkey
  cors:
    # Production deploys must set APP_CORS_ALLOWED_ORIGINS to a
    # comma-separated list of trusted origins. SecurityConfig fails
    # fast at startup if this is empty in non-stub mode.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  blobstore:
    type: ${APP_BLOBSTORE_TYPE:filesystem}
    root: ${RETIREMENT_DATA_DIR:/var/lib/retirement-planner/blobs}
