# Local development profile. Postgres comes up via `podman compose up`
# per ADR-001 (Podman, not Docker). The host port is 5433 to avoid
# colliding with any other Postgres container the developer may have on
# the standard 5432.
#
# JPA is intentionally not configured yet — the `spring-boot-starter-data-jpa`
# dependency lands with the first entity in S-1.6 (Account/Sleeve), at which
# point the spring.jpa.* block returns alongside it.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/retirement_planner
    username: retirement
    password: retirement
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: false

logging:
  level:
    root: INFO
    io.github.xmljim.retirement: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith,prometheus
