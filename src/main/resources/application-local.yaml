# Local development profile. Postgres comes up via `podman compose up`
# per ADR-001 (Podman, not Docker). The host port is 5433 to avoid
# colliding with any other Postgres container the developer may have on
# the standard 5432.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/retirement_planner
    username: retirement
    password: retirement
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: false
  jpa:
    # Flyway owns the schema; Hibernate must never alter it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false

logging:
  level:
    root: INFO
    io.github.xmljim.retirement: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith,prometheus

app:
  cors:
    # React dev server (Vite default port).
    allowed-origins:
      - http://localhost:5173
